<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tab Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0A0A0A;
      --ink-dim: rgba(80, 85, 100, 0.65);
      --ink-faint: rgba(80, 85, 100, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.08);
      --highlight-bg: linear-gradient(180deg, rgba(200, 205, 215, 0.5), rgba(180, 185, 195, 0.2));
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
    }

    body {
      padding: 20px;
    }

    .tabbar-wrap {
      position: relative;
      animation: slide-up 0.6s var(--spring) 0.2s both;
    }
    @keyframes slide-up {
      from { transform: translateY(80px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .tabbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      animation: float 5s ease-in-out infinite;
      animation-delay: 0.8s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-3px); }
      50% { transform: translateY(1px); }
      75% { transform: translateY(-2px); }
    }

    .tabbar-highlight {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 0;
      z-index: 1;
      border-radius: 999px;
      width: 56px;
      background: var(--highlight-bg);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9);
      transition: transform 0.5s var(--spring), width 0.4s var(--spring);
      pointer-events: none;
      will-change: transform, width;
    }

    .tab {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 14px;
      border: none;
      background: none;
      color: var(--ink-dim);
      font-size: 13px;
      font-weight: 500;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s var(--ease);
    }
    .tab svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s var(--spring);
    }
    .tab[aria-selected="true"] { color: var(--ink); }
    .tab:not([aria-selected="true"]):hover { color: rgba(30,35,50,0.8); }
    .tab:not([aria-selected="true"]):hover svg { transform: scale(1.08); }

    .tab.is-bouncing svg {
      animation: bounce 0.45s var(--spring);
    }
    @keyframes bounce {
      25% { transform: scale(0.7); }
      55% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .tab-label {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      margin-left: 0;
      transition: max-width 0.35s var(--ease), opacity 0.25s var(--ease), margin-left 0.35s var(--ease);
    }
    .tab[aria-selected="true"] .tab-label {
      max-width: 80px;
      opacity: 1;
      margin-left: 7px;
    }

    .tabbar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(120px 80px at var(--mx, 50%) var(--my, 0%), rgba(0,0,0,0.04), transparent 70%);
      opacity: 0.6;
      mix-blend-mode: multiply;
      transition: background 0.1s ease-out;
    }

    .tabbar::after {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: -10%;
      width: 40px;
      border-radius: 999px;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0.04) 50%, rgba(0,0,0,0) 80%, transparent 100%);
      mix-blend-mode: multiply;
      animation: shimmer 6s ease-in-out infinite;
      animation-delay: 1.2s;
    }
    @keyframes shimmer {
      0% { left: -10%; opacity: 0; }
      10% { opacity: 0.6; }
      40% { left: 90%; opacity: 0.6; }
      50% { left: 90%; opacity: 0; }
      100% { left: -10%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tabbar-wrap { animation: none !important; transform: none !important; opacity: 1 !important; }
      .tabbar { animation: none !important; }
      .tabbar::after { animation: none !important; display: none; }
      .tab.is-bouncing svg { animation: none !important; }
    }
  </style>
</head>
<body>
  <nav class="tabbar-wrap">
    <div class="tabbar" id="tabbar" role="tablist">
      <div class="tabbar-highlight" id="tabHighlight"></div>
      <button class="tab" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="tab-label">Home</span>
      </button>
      <button class="tab" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.3"/><path d="M20 20l-4.3-4.3"/></svg>
        <span class="tab-label">Explore</span>
      </button>
      <button class="tab" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg>
        <span class="tab-label">Create</span>
      </button>
      <button class="tab" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
        <span class="tab-label">Activity</span>
      </button>
      <button class="tab" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>
        <span class="tab-label">Profile</span>
      </button>
    </div>
  </nav>

  <script>
    (function() {
      "use strict";

      const tabbar = document.getElementById("tabbar");
      const highlight = document.getElementById("tabHighlight");
      const tabs = Array.from(tabbar.querySelectorAll(".tab"));

      function moveHighlight(target) {
        const barRect = tabbar.getBoundingClientRect();
        const tRect = target.getBoundingClientRect();
        highlight.style.transform = "translateX(" + (tRect.left - barRect.left) + "px)";
        highlight.style.width = tRect.width + "px";
      }

      function selectTab(target, opts = {}) {
        tabs.forEach(btn => btn.setAttribute("aria-selected", String(btn === target)));

        moveHighlight(target);
        if (opts.bounce !== false) {
          target.classList.remove("is-bouncing");
          void target.offsetWidth;
          target.classList.add("is-bouncing");
          setTimeout(() => target.classList.remove("is-bouncing"), 500);
        }

        const label = target.querySelector('.tab-label');
        if (label) {
          const handler = () => {
            moveHighlight(target);
            label.removeEventListener('transitionend', handler);
          };
          label.addEventListener('transitionend', handler);
        }
      }

      tabs.forEach(btn => {
        btn.addEventListener("click", () => selectTab(btn));
      });

      tabbar.addEventListener("pointermove", e => {
        const r = tabbar.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width * 100);
        const y = ((e.clientY - r.top) / r.height * 100);
        tabbar.style.setProperty("--mx", x + "%");
        tabbar.style.setProperty("--my", y + "%");
      });
      tabbar.addEventListener("pointerleave", () => {
        tabbar.style.setProperty("--mx", "50%");
        tabbar.style.setProperty("--my", "0%");
      });

      document.addEventListener("keydown", e => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        const idx = ["1","2","3","4","5"].indexOf(e.key);
        if (idx >= 0 && idx < tabs.length) {
          e.preventDefault();
          selectTab(tabs[idx]);
        }
      });

      const initial = tabbar.querySelector('.tab[aria-selected="true"]') || tabs[0];
      moveHighlight(initial);

      window.addEventListener("resize", () => {
        const active = tabbar.querySelector('.tab[aria-selected="true"]');
        if (active) moveHighlight(active);
      });
    })();
  </script>
</body>
</html>
